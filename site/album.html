<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Photo album 📸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>ZK.requireAccess();</script>
</head>
<body>
  <div class="bg"></div>
  <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <header class="topbar">
    <a class="back" href="index.html">← Home</a>
    <a class="back" href="bubbles.html">🫧 Bubbles</a>
  </header>

  <div class="page-head">
    <h1>Our <span class="accent">memories</span></h1>
    <p class="lead">Five years in pictures 💚 (tap a photo to enlarge it)</p>
  </div>

  <main>
    <p class="lead" id="loading" style="text-align:center">Unwrapping the memories… 🎁</p>
    <div class="gallery" id="gallery"></div>
    <div class="empty hidden" id="empty">
      <h2>Photos coming soon 📷</h2>
      <p class="lead">The album is being filled with love.</p>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  </div>

  <script>
    const gallery = document.getElementById("gallery");
    const empty   = document.getElementById("empty");
    const loading = document.getElementById("loading");

    /* ---- Build the album from the encrypted data ---- */
    (async () => {
      const session = await ZK.requireSession();
      if (!session) return;
      const { manifest, key } = session;
      const entries = manifest.album || [];

      // Decrypt all photos (in parallel), keep the original order
      const photos = await Promise.all(entries.map(async (e, i) => {
        try { return { url: await ZK.photoURL(key, e.f), caption: e.c || "", i }; }
        catch (err) { return null; }        // missing/unreadable photo → skipped
      }));

      photos.filter(Boolean).forEach((p, n) => {
        const fig = document.createElement("figure");
        const btn = document.createElement("button");
        const img = new Image();
        const cap = document.createElement("figcaption");
        btn.type = "button";
        btn.setAttribute("aria-label", "Open photo " + (n + 1));
        img.alt = p.caption || ("Photo " + (n + 1));
        img.src = p.url;
        cap.textContent = p.caption;
        btn.appendChild(img);
        fig.append(btn, cap);
        gallery.appendChild(fig);
        btn.addEventListener("click", () => openAt(fig));
      });

      loading.classList.add("hidden");
      if (!gallery.children.length) empty.classList.remove("hidden");
    })();

    /* ---- Lightbox ---- */
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbCap = document.getElementById("lbCap");
    let current = 0;

    const figures = () => Array.from(gallery.querySelectorAll("figure"));

    function show(i) {
      const list = figures();
      if (!list.length) return close();
      current = (i + list.length) % list.length;
      const img = list[current].querySelector("img");
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbCap.textContent = list[current].querySelector("figcaption").textContent;
    }
    function openAt(fig) { show(figures().indexOf(fig)); lb.classList.add("open"); }
    function close() { lb.classList.remove("open"); }

    document.getElementById("lbClose").addEventListener("click", close);
    document.getElementById("lbPrev").addEventListener("click", () => show(current - 1));
    document.getElementById("lbNext").addEventListener("click", () => show(current + 1));
    lb.addEventListener("click", (e) => { if (e.target === lb) close(); });
    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(current - 1);
      if (e.key === "ArrowRight") show(current + 1);
    });
  </script>
</body>
</html>
