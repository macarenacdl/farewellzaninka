<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>For Zaninka 💚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <main class="stage">
    <section class="card pop-in">

      <!-- ▼ PHOTO OF ZANINKA: replace the file images/home/zaninka.jpg (same name) ▼ -->
      <!-- The photo only appears AFTER the password; before that, a heart is shown -->
      <div class="photo-ring">
        <div class="photo-fallback" id="photoSlot">💚</div>
      </div>

      <h1>Dear <span class="accent">Zaninka</span></h1>

      <!-- Locked state -->
      <div id="locked">
        <p class="lead">Five years, one huge thank you.<br>This little corner of the internet is just for you.</p>

        <form class="gate" id="gate" autocomplete="off">
          <label for="pw">Enter the password to open it</label>
          <div class="pw-row">
            <div class="pw-field">
              <input id="pw" type="password" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
              <button type="button" class="pw-toggle" id="toggle" aria-label="Show password">👁️</button>
            </div>
            <button class="btn" type="submit">Open</button>
          </div>
          <p class="error" id="error" role="alert"></p>
        </form>
      </div>

      <!-- Unlocked state -->
      <div id="unlocked" class="hidden">
        <p class="lead">Welcome! 💚 Your colleagues prepared something for you.<br>Pick where to start:</p>
        <nav class="menu">
          <a class="big-btn album" href="album.html">
            <span class="big-emoji">📸</span>
            Photo album
            <small>Our favourite memories</small>
          </a>
          <a class="big-btn bubbles" href="bubbles.html">
            <span class="big-emoji">🫧</span>
            Bubbles of love
            <small>Pop them, read our messages</small>
          </a>
        </nav>
      </div>

      <p class="footer-note">With love, from all of us 💚</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const locked   = document.getElementById("locked");
    const unlocked = document.getElementById("unlocked");
    const form     = document.getElementById("gate");
    const input    = document.getElementById("pw");
    const error    = document.getElementById("error");
    const slot     = document.getElementById("photoSlot");
    const openBtn  = form.querySelector("button[type=submit]");

    // Decrypts and shows her photo (only possible after the right password)
    async function revealPhoto({ manifest, key }) {
      if (!manifest.home) return;
      try {
        const img = new Image();
        img.alt = SITE.name;
        img.src = await ZK.photoURL(key, manifest.home);
        await img.decode();
        img.classList.add("pop-in");
        slot.replaceWith(img);
      } catch (e) { slot.textContent = SITE.name.charAt(0); }
    }

    function showMenu(animate) {
      locked.classList.add("hidden");
      unlocked.classList.remove("hidden");
      if (animate) unlocked.classList.add("pop-in");
    }

    // Already unlocked earlier in this tab? Skip the password.
    if (ZK.hasSession()) {
      ZK.session().then((s) => { if (s) { showMenu(false); revealPhoto(s); } });
    }

    document.getElementById("toggle").addEventListener("click", () => {
      input.type = input.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      if (!window.crypto || !crypto.subtle) {
        error.textContent = "This page must be opened over https (e.g. on GitHub Pages).";
        return;
      }
      openBtn.disabled = true;
      openBtn.textContent = "Opening…";
      try {
        // Not case-sensitive, so phone keyboards that capitalise the first letter still work
        const s = await ZK.unlock(input.value.trim().toLowerCase());
        showMenu(true);
        revealPhoto(s);
      } catch (err) {
        if (!err || err.name !== "OperationError") {
          // Not a wrong password: the encrypted files could not be loaded at all
          error.textContent = location.protocol === "file:"
            ? "This page can't be tested by double-clicking the file: browsers block it. Open it through its GitHub Pages web address."
            : "Couldn't load the site data. Check that the \"data\" folder was uploaded next to index.html.";
        } else {
          error.textContent = "Hmm, that's not it. Try again! 🙈";
          form.classList.remove("shake");
          void form.offsetWidth;
          form.classList.add("shake");
          input.select();
        }
      } finally {
        openBtn.disabled = false;
        openBtn.textContent = "Open";
      }
    });
  </script>
</body>
</html>
